<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="pi_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0c2333"/>
      <stop offset="60%" stop-color="#06121a"/>
      <stop offset="100%" stop-color="#020609"/>
    </radialGradient>
    <filter id="pi_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Ring with Neon Glow -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#00d2ff" stroke-width="4" filter="url(#pi_glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#pi_bg)" stroke="#03486a" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#00d2ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Greek Pi Symbol (π) with futuristic wings -->
  <path d="M 65 72 L 135 72 M 82 72 L 78 116 M 118 72 L 118 112 Q 118 118 126 118" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#pi_glow)"/>
  <polygon points="144,80 156,92 144,104" fill="#00d2ff" opacity="0.8"/>
  <polygon points="56,80 44,92 56,104" fill="#00d2ff" opacity="0.8"/>
  <!-- Platform Name Pill -->
  <rect x="30" y="142" width="140" height="26" rx="13" fill="#000000" fill-opacity="0.85" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="100" y="159" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="800" font-size="12" fill="#00d2ff" letter-spacing="2">PI PRO</text>
</svg>