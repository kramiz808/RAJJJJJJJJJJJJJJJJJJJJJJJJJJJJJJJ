<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="yo_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0d1b38"/>
      <stop offset="60%" stop-color="#060c1c"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <filter id="yo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#3b82f6" stroke-width="4" filter="url(#yo_glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#yo_bg)" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Officer Star Crest -->
  <polygon points="100,50 109,74 134,74 114,89 122,112 100,98 78,112 86,89 66,74 91,74" fill="#60a5fa" filter="url(#yo_glow)"/>
  <text x="100" y="128" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1">YO</text>
  <rect x="22" y="142" width="156" height="26" rx="13" fill="#000000" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="159" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="800" font-size="11" fill="#60a5fa" letter-spacing="1.5">YES OFFICER</text>
</svg>