<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sw_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a2538"/>
      <stop offset="60%" stop-color="#04121c"/>
      <stop offset="100%" stop-color="#01060a"/>
    </radialGradient>
    <filter id="sw_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#0ea5e9" stroke-width="4" filter="url(#sw_glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#sw_bg)" stroke="#0369a1" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Target Crosshair + Speed Lightning -->
  <circle cx="100" cy="85" r="26" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#sw_glow)"/>
  <circle cx="100" cy="85" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="102,62 88,88 102,88 96,112 116,84 102,84" fill="#ffffff" filter="url(#sw_glow)"/>
  <text x="100" y="128" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff" filter="url(#sw_glow)" letter-spacing="1">SW</text>
  <rect x="22" y="142" width="156" height="26" rx="13" fill="#000000" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="100" y="159" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#38bdf8" letter-spacing="1.5">SELECTION WAY</text>
</svg>
