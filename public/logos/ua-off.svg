<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="uaf_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#142c08"/>
      <stop offset="60%" stop-color="#0a1704"/>
      <stop offset="100%" stop-color="#030801"/>
    </radialGradient>
    <filter id="uaf_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#84cc16" stroke-width="4" filter="url(#uaf_glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#uaf_bg)" stroke="#4d7c0f" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#84cc16" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Classroom Kota Podium -->
  <polygon points="100,54 136,74 100,94 64,74" fill="#a3e635" filter="url(#uaf_glow)"/>
  <text x="100" y="128" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">KOTA</text>
  <rect x="18" y="142" width="164" height="26" rx="13" fill="#000000" fill-opacity="0.85" stroke="#84cc16" stroke-width="1.5"/>
  <text x="100" y="159" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="800" font-size="9" fill="#a3e635" letter-spacing="1.2">UNACADEMY OFFLINE</text>
