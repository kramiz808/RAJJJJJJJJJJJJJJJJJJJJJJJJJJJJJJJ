<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="vb_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3b0a2a"/>
      <stop offset="60%" stop-color="#1f0416"/>
      <stop offset="100%" stop-color="#0a0107"/>
    </radialGradient>
    <filter id="vb_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#e11d48" stroke-width="4" filter="url(#vb_glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#vb_bg)" stroke="#881337" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#e11d48" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Vibrant Kota Star / Diamond -->
  <polygon points="100,48 116,84 152,100 116,116 100,152 84,116 48,100 84,84" fill="#f43f5e" filter="url(#vb_glow)" opacity="0.85"/>
  <circle cx="100" cy="100" r="16" fill="#ffffff"/>
  <text x="100" y="106" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="900" font-size="16" fill="#881337">VB</text>
  <rect x="20" y="142" width="160" height="26" rx="13" fill="#000000" fill-opacity="0.85" stroke="#e11d48" stroke-width="1.5"/>
  <text x="100" y="159" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#f43f5e" letter-spacing="1.5">VIBRANT KOTA</text>
</svg>