<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ua_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#082c2c"/>
      <stop offset="60%" stop-color="#041414"/>
      <stop offset="100%" stop-color="#010606"/>
    </radialGradient>
    <filter id="ua_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#06b6d4" stroke-width="4" filter="url(#ua_glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#ua_bg)" stroke="#0e7490" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Unacademy Dual Arcs -->
  <path d="M70,82 C70,62 130,62 130,82 C130,102 70,102 70,82 Z" fill="none" stroke="#22d3ee" stroke-width="6" filter="url(#ua_glow)"/>
  <circle cx="100" cy="82" r="10" fill="#ffffff"/>
  <text x="100" y="128" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">UA</text>
  <rect x="20" y="142" width="160" height="26" rx="13" fill="#000000" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="100" y="159" text-anchor="middle" font-family="'Orbitron', system-ui, sans-serif" font-weight="800" font-size="9.5" fill="#22d3ee" letter-spacing="1.2">UNACADEMY ONLINE</text>
</svg>