<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ss-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0f172a" stroke="url(#ss-grad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Graduation Cap Top -->
  <path d="M50 24 L80 37 L50 50 L20 37 Z" fill="url(#ss-grad)" />
  <!-- Graduation Cap Under -->
  <path d="M30 43.5 V56 C30 63 70 63 70 56 V43.5" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <!-- Tassel -->
  <path d="M74 38 V52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="74" cy="54" r="2.5" fill="#38bdf8" />

  <!-- Lightning Center Accent -->
  <path d="M52 50 L42 66 H51 L46 80 L62 61 H52 Z" fill="#38bdf8" filter="url(#glow)"/>
</svg>
